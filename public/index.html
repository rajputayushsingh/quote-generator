<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quote Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>✨ Quote Generator</h1>

        <div class="quote-card">

            <p id="quote">
                Click the button to get an inspiring quote.
            </p>

            <h3 id="author">
                — Unknown
            </h3>

            <div class="buttons">

                <button id="newQuote">
                    🔄 New Quote
                </button>

                <button id="favorite">
                    ❤️ Favorite
                </button>

                <button id="copy">
                    📋 Copy
                </button>

            </div>

        </div>


        <h2>❤️ Favorite History</h2>

        <div id="favorites"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
